video.PlatformDecoding.vaapi_hevc_files_from_bugs_239819547:
  expectation: FAIL
  tickets:
  - b/239819547
  comments: "For this bug, pictures that should be outputted are prematurely flushed from the DPB before being outputted. Essentially, DPB::Clear() will be called before H265Decoder::OutputPic() will be called for the frames shown below. This causes the picture to be flushed from the DPB before it is correctly outputted. When this bug occurs, it makes the video appear “choppy” as frames that should be outputted are missing."
  since_build: R108-15183.70.0

video.PlatformDecoding.vaapi_hevc_files_from_bugs_239927523:
  expectation: FAIL
  tickets:
  - b/239927523
  comments: "For the test-vectors listed below the decoder outputs frames that should not be outputted. In almost all cases, these frames have a NAL unit type of RASL_*. Additionally, when this bug occurs, there will be additional distorted frames outputted. We find that this distortion does not impact other frames."
  since_build: R108-15183.70.0

